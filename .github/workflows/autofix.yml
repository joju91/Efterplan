name: autofix

# Triggas när en Vercel-deploy misslyckas (Production). Klonar den
# misslyckade commiten, låter Groq-agenten analysera och fixa felet,
# och öppnar en PR. Mergar aldrig automatiskt.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deploy_description:
        description: 'Felmeddelande (för test-körning)'
        required: false
        default: 'Manuell test-körning av autofix-workflow'

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'failure' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installera agentberoenden
        working-directory: scripts/agent
        run: npm install

      - name: Konfigurera git
        run: |
          git config user.name "efterplan-bot"
          git config user.email "efterplan-bot@users.noreply.github.com"

      - name: Skapa fix-branch
        id: branch
        run: |
          BRANCH="autofix/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Kör Groq-agent (autofix)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEPLOY_SHA: ${{ github.event.deployment.sha || github.sha }}
          DEPLOY_DESC: ${{ github.event.deployment_status.description || inputs.deploy_description }}
          DEPLOY_LOG: ${{ github.event.deployment_status.log_url || '' }}
        run: node scripts/agent/index.mjs autofix

      - name: Pusha och öppna PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          DEPLOY_SHA: ${{ github.event.deployment.sha || github.sha }}
          DEPLOY_DESC: ${{ github.event.deployment_status.description || inputs.deploy_description }}
          DEPLOY_LOG: ${{ github.event.deployment_status.log_url || '' }}
        run: |
          if ! git log origin/main..HEAD --oneline 2>/dev/null | grep -q .; then
            echo "Inga commits från agenten — hoppar över PR."
            exit 0
          fi

          git push origin "$BRANCH"
          COMMITS=$(git log origin/main..HEAD --oneline)

          gh pr create \
            --title "autofix: Vercel-deploy misslyckades (${DEPLOY_SHA:0:7})" \
            --base main \
            --head "$BRANCH" \
            --body "## Automatisk fix — Vercel-deploy misslyckades

          **Commit:** \`$DEPLOY_SHA\`
          **Felmeddelande:** $DEPLOY_DESC
          $([ -n "$DEPLOY_LOG" ] && echo "**Logg:** $DEPLOY_LOG" || true)

          Groq-agenten analyserade deploy-felet och implementerade en fix.
          Granska diff:en innan merge.

          ### Commits
          \`\`\`
          $COMMITS
          \`\`\`

          ---
          _Genererad automatiskt av [autofix](.github/workflows/autofix.yml)_"
