name: roadmap

# Nattlig cron: Groq-agenten väljer den ticket med högst prioritet i
# claude/open/ som inte rör betalflöde eller juridik, implementerar
# den och öppnar en PR. Inget passande ticket = avslutar tyst.
# Mergar aldrig automatiskt.

on:
  schedule:
    - cron: '0 1 * * *'  # 01:00 UTC varje natt
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kontrollera om det finns tickets
        id: check
        run: |
          count=$(find claude/open -name "*.md" 2>/dev/null | wc -l)
          echo "Hittade $count ticket(s) i claude/open/"
          echo "count=$count" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        if: steps.check.outputs.count != '0'
        with:
          node-version: '22'

      - name: Installera agentberoenden
        if: steps.check.outputs.count != '0'
        working-directory: scripts/agent
        run: npm install

      - name: Konfigurera git
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name "efterplan-bot"
          git config user.email "efterplan-bot@users.noreply.github.com"

      - name: Skapa roadmap-branch
        if: steps.check.outputs.count != '0'
        id: branch
        run: |
          BRANCH="roadmap/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Kör Groq-agent (roadmap)
        if: steps.check.outputs.count != '0'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/agent/index.mjs roadmap

      - name: Pusha och öppna PR
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          if ! git log origin/main..HEAD --oneline 2>/dev/null | grep -q .; then
            echo "Inga commits — ingen passande ticket implementerades."
            exit 0
          fi

          COMMITS=$(git log origin/main..HEAD --oneline)
          TICKET=$(git diff --name-only origin/main HEAD | grep "^claude/done/" | head -1 || echo "")
          PR_TITLE=$(git log origin/main..HEAD --oneline | head -1 | sed 's/^[a-f0-9]* //')

          git push origin "$BRANCH"

          gh pr create \
            --title "roadmap: $PR_TITLE" \
            --base main \
            --head "$BRANCH" \
            --body "## Automatisk roadmap-implementation

          $([ -n "$TICKET" ] && echo "**Implementerad ticket:** \`$TICKET\`" || echo "")

          Groq-agenten valde och implementerade ticketen med högst prioritet från \`claude/open/\`
          som inte rör betalflöde eller juridik. Granska ändringarna innan merge.

          ### Commits
          \`\`\`
          $COMMITS
          \`\`\`

          ---
          _Genererad automatiskt av [roadmap](.github/workflows/roadmap.yml)_"
