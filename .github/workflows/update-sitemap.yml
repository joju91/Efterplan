name: Update Sitemap & Notify Google

# Triggas av push till main som rör en .html-sida. sitemap.xml är .xml, inte
# .html, så bot-committen från detta workflow triggar inte sig själv igen.
on:
  push:
    branches: [main]
    paths:
      - '*.html'
  workflow_dispatch: # tillåt manuell körning från Actions-fliken (t.ex. för test)

permissions:
  contents: write # behöver kunna pusha uppdaterad sitemap.xml tillbaka till repo

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # behöver full git-historik för lastmod per fil

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install indexing script deps
        working-directory: scripts/indexing
        run: npm ci

      - name: Update sitemap.xml
        id: update
        run: node scripts/indexing/update-sitemap.mjs

      - name: Commit and push sitemap.xml
        if: steps.update.outputs.sitemap_changed == 'true'
        run: |
          git config user.name  "efterplan-bot"
          git config user.email "efterplan-bot@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "Ingen förändring i sitemap.xml — hoppar över commit."
          else
            git commit -m "Auto: uppdatera sitemap.xml (GitHub Actions)"
            git push
          fi

      - name: Submit sitemap to Google Search Console
        if: steps.update.outputs.sitemap_changed == 'true'
        working-directory: scripts/indexing
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node submit-sitemap.mjs

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Sitemap-uppdatering"
            if [ "${{ steps.update.outputs.sitemap_changed }}" == "true" ]; then
              echo "✅ sitemap.xml ändrades och committades. Google notifierades via Search Console API."
            else
              echo "ℹ️ Ingen ändring i sitemap.xml — inget att skicka till Google."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
