name: Supabase Keep-Alive

# T163 — Supabase gratisnivå auto-pausar projekt efter ~7 dagars inaktivitet,
# vilket 2026-08-12 tyst slog ut inloggning, sparade planer och betalnings-
# webhooken (DNS slutade svara helt). Den här workflowen gör ett litet
# autentiserat databasanrop ett par gånger i veckan så projektet räknas
# som aktivt och aldrig hinner pausas.

on:
  schedule:
    # Måndag och torsdag 06:00 UTC — gap på 3–4 dagar, gott om marginal
    # under Supabase 7-dagarsgräns även om ett körningstillfälle skulle missas.
    - cron: '0 6 * * 1,4'
  workflow_dispatch:  # tillåt manuell körning från Actions-fliken

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase-databasen
        env:
          # Projekt-URL är inte känslig (samma sak som att veta domänen),
          # så den ligger direkt här istället för som ett extra repo-secret.
          SUPABASE_URL: https://vjupkemzpnrahdsljenl.supabase.co
          # Publishable-nyckeln är publik (ligger i supabase-client.js), så den
          # behöver inget repo-secret. Använd INTE service-role-nyckeln här.
          SUPABASE_KEY: sb_publishable_8eZKlNPSB5gH0gDYO8pb0Q__5w2kYs3
        run: |
          # Riktig tabellfråga i stället för /rest/v1/ (OpenAPI-spec), som inte
          # längre accepterar publika nycklar (gav 401 från 2026-09-28).
          # RLS kan ge en tom lista — det är fortfarande 200 och ett DB-anrop.
          status=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/ads_budget?select=daily_budget_sek&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          cat /tmp/resp.json; echo
          echo "HTTP status: $status"
          if [ "$status" -ge 400 ]; then
            echo "Oväntat felstatus från Supabase — projektet kan vara pausat eller nyckeln ogiltig."
            exit 1
          fi
