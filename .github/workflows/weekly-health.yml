name: Weekly Health Check

on:
  schedule:
    # Måndag 08:00 UTC = 10:00 CEST (sommartid) / 09:00 CET (vintertid)
    - cron: '0 8 * * 1'
  workflow_dispatch:  # tillåt manuell körning från Actions-fliken

permissions:
  issues: write  # öppnar en issue om något går sönder

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Domain redirect check
        # www och http ska nå https://efterplan.se/ enbart via 301/308
        run: |
          fail=0
          for u in https://www.efterplan.se/ http://www.efterplan.se/ http://efterplan.se/; do
            codes=$(curl -sIL "$u" | awk '/^HTTP/{print $2}')
            final=$(curl -sL -o /dev/null -w '%{url_effective}' "$u")
            echo "$u -> [$codes] $final"
            for c in $codes; do case "$c" in 301|308|200) ;; *) echo "::error::$u ger $c, väntade 301/308"; fail=1 ;; esac; done
            [ "$final" = https://efterplan.se/ ] || { echo "::error::$u landar på $final"; fail=1; }
          done
          exit $fail

      - name: Broken link check
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose --no-progress
            --exclude '^https://fonts\.(gstatic|googleapis)\.com/$'
            './**/*.html'
          fail: true

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://efterplan.se
            https://efterplan.se/checklista-dodsbo.html
            https://efterplan.se/bouppteckning-guide.html
            https://efterplan.se/dodsannons.html
            https://efterplan.se/vad-gora-nar-nagon-dor.html
            https://efterplan.se/gratis-checklista-abonnemang.html
          # configPath, INTE budgetPath: budgetPath är Lighthouse "budgets.json"
          # -formatet (ett annat, inkompatibelt schema) och utan någotdera
          # hoppar actionen tyst över assert-steget helt, se T225-sessionen.
          configPath: .lighthouserc.json
          uploadArtifacts: true

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Weekly health check failed — ' + new Date().toISOString().slice(0, 10),
              labels: ['maintenance'],
              body: 'Se Actions-loggen för detaljer: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })
