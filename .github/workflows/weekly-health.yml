name: Weekly Health Check

on:
  schedule:
    # Måndag 08:00 UTC = 10:00 CEST (sommartid) / 09:00 CET (vintertid)
    - cron: '0 8 * * 1'
  workflow_dispatch:  # tillåt manuell körning från Actions-fliken

permissions:
  issues: write  # öppnar en issue om något går sönder

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Broken link check
        uses: nick-fields/retry@v3
        with:
          # lychee-action laddar ner sin binär från GitHub Releases vid varje
          # körning (ingen cache) — en sporadisk CDN-hicka gav "not in gzip
          # format" och en falsk röd körning 2026-09-14. Retry:ar hela steget
          # (inte bara nedladdningen) så en riktig trasig länk fortfarande
          # fäller jobbet, bara efter 3 försök istället för 1.
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |
            rm -rf "$HOME/.local/bin/lychee" lychee-*.tar.gz lychee
            curl -sSL -o lychee.tar.gz \
              "https://github.com/lycheeverse/lychee/releases/download/v0.15.0/lychee-v0.15.0-x86_64-unknown-linux-gnu.tar.gz"
            tar -xzf lychee.tar.gz
            mkdir -p "$HOME/.local/bin"
            install -t "$HOME/.local/bin" -D lychee
            "$HOME/.local/bin/lychee" --verbose --no-progress \
              --exclude '^https://fonts\.(gstatic|googleapis)\.com/$' \
              './**/*.html'

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://efterplan.se
            https://efterplan.se/checklista-dodsbo.html
            https://efterplan.se/bouppteckning-guide.html
            https://efterplan.se/dodsannons.html
          # configPath, INTE budgetPath: budgetPath är Lighthouse "budgets.json"
          # -formatet (ett annat, inkompatibelt schema) och utan någotdera
          # hoppar actionen tyst över assert-steget helt, se T225-sessionen.
          configPath: .lighthouserc.json
          uploadArtifacts: true

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Weekly health check failed — ' + new Date().toISOString().slice(0, 10),
              labels: ['maintenance'],
              body: 'Se Actions-loggen för detaljer: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })
